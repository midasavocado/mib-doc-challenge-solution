<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Conservative dual-engine MIB architecture</title>
  <desc id="desc">PDFs are rendered and extracted once. Engine A makes the primary evidence decision. Engine B independently classifies the same fields. The arbiter accepts a decision only with directional agreement and no hard veto; a contrary B denial can move an unsigned A approval only to review.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0l12 6-12 6z" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#020617" flood-opacity=".16"/>
    </filter>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#12304a"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" rx="28" fill="#f8fafc"/>
  <rect width="1600" height="122" rx="28" fill="url(#header)"/>
  <rect y="94" width="1600" height="28" fill="url(#header)"/>
  <text x="64" y="58" fill="#f8fafc" font-family="ui-sans-serif, system-ui, sans-serif" font-size="34" font-weight="800">CONSERVATIVE DUAL-ENGINE CLASSIFICATION</text>
  <text x="64" y="94" fill="#bae6fd" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20">Engine B breaks only a supported tie. Engine A owns the safety boundary.</text>

  <g font-family="ui-sans-serif, system-ui, sans-serif" filter="url(#shadow)">
    <rect x="58" y="190" width="220" height="128" rx="18" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <text x="168" y="236" text-anchor="middle" fill="#0f172a" font-size="24" font-weight="750">PDF packet</text>
    <text x="168" y="272" text-anchor="middle" fill="#64748b" font-size="18">read-only input</text>

    <rect x="356" y="174" width="300" height="160" rx="18" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
    <text x="506" y="218" text-anchor="middle" fill="#164e63" font-size="24" font-weight="750">Shared evidence layer</text>
    <text x="506" y="252" text-anchor="middle" fill="#0e7490" font-size="17">render · OCR · case binding</text>
    <text x="506" y="279" text-anchor="middle" fill="#0e7490" font-size="17">field provenance · conflict state</text>
    <text x="506" y="306" text-anchor="middle" fill="#0e7490" font-size="17">one extraction record</text>

    <rect x="760" y="152" width="338" height="190" rx="20" fill="#ecfdf5" stroke="#10b981" stroke-width="3"/>
    <text x="929" y="199" text-anchor="middle" fill="#064e3b" font-size="26" font-weight="800">ENGINE A · PRIMARY</text>
    <text x="929" y="235" text-anchor="middle" fill="#047857" font-size="18">source-bound evidence rules</text>
    <text x="929" y="265" text-anchor="middle" fill="#047857" font-size="18">signed findings · denial witnesses</text>
    <text x="929" y="295" text-anchor="middle" fill="#047857" font-size="18">approval quorum · safety fence</text>
    <rect x="790" y="312" width="278" height="36" rx="18" fill="#047857"/>
    <text x="929" y="337" text-anchor="middle" fill="#ecfdf5" font-size="14" font-weight="700">FINAL + PRE-SAFETY LEAN</text>

    <rect x="760" y="446" width="338" height="190" rx="20" fill="#fff7ed" stroke="#f97316" stroke-width="3"/>
    <text x="929" y="493" text-anchor="middle" fill="#7c2d12" font-size="22" font-weight="800">ENGINE B · SECOND OPINION</text>
    <text x="929" y="529" text-anchor="middle" fill="#9a3412" font-size="18">public-training classifier</text>
    <text x="929" y="559" text-anchor="middle" fill="#9a3412" font-size="18">topology · field cells · shapes</text>
    <text x="929" y="589" text-anchor="middle" fill="#9a3412" font-size="18">starts from abstention</text>
    <rect x="800" y="606" width="258" height="36" rx="18" fill="#c2410c"/>
    <text x="929" y="631" text-anchor="middle" fill="#fff7ed" font-size="14" font-weight="700">DEFAULT ON · ABLATABLE</text>

    <rect x="1202" y="276" width="338" height="282" rx="22" fill="#eff6ff" stroke="#3b82f6" stroke-width="3"/>
    <text x="1371" y="326" text-anchor="middle" fill="#1e3a8a" font-size="23" font-weight="800">CONSERVATIVE ARBITER</text>
    <text x="1240" y="372" fill="#1d4ed8" font-size="18" font-weight="700">1</text>
    <text x="1270" y="372" fill="#334155" font-size="17">A denial / signed approval wins</text>
    <text x="1240" y="414" fill="#1d4ed8" font-size="18" font-weight="700">2</text>
    <text x="1270" y="414" fill="#334155" font-size="17">B must match A's prior lean</text>
    <text x="1240" y="456" fill="#1d4ed8" font-size="18" font-weight="700">3</text>
    <text x="1270" y="456" fill="#334155" font-size="17">Hard evidence vetoes remain</text>
    <text x="1240" y="498" fill="#1d4ed8" font-size="18" font-weight="700">4</text>
    <text x="1270" y="498" fill="#334155" font-size="17">Otherwise keep review</text>
    <rect x="1228" y="521" width="286" height="42" rx="21" fill="#1d4ed8"/>
    <text x="1371" y="549" text-anchor="middle" fill="#eff6ff" font-size="14" font-weight="800">BRIDGED CONFIDENCE 0.90</text>

    <rect x="1202" y="664" width="338" height="116" rx="20" fill="#ffffff" stroke="#334155" stroke-width="2"/>
    <text x="1371" y="707" text-anchor="middle" fill="#0f172a" font-size="24" font-weight="800">JSONL</text>
    <text x="1371" y="741" text-anchor="middle" fill="#64748b" font-size="17">9 fields · decision · confidence</text>
  </g>

  <g fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)">
    <path d="M278 254h68"/>
    <path d="M656 238h92"/>
    <path d="M656 276c56 0 48 265 92 265"/>
    <path d="M1098 246c68 0 50 118 92 118"/>
    <path d="M1098 541c68 0 50-78 92-78"/>
    <path d="M1371 558v94"/>
  </g>

  <rect x="62" y="708" width="1036" height="90" rx="18" fill="#fff1f2" stroke="#fb7185" stroke-width="2"/>
  <text x="90" y="744" fill="#9f1239" font-family="ui-sans-serif, system-ui, sans-serif" font-size="19" font-weight="800">ABSOLUTE VETOES</text>
  <text x="90" y="775" fill="#881337" font-family="ui-sans-serif, system-ui, sans-serif" font-size="17">visible risk · signed conflict · unknown fee · medical-clearance gap · authority mismatch</text>

  <text x="64" y="856" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">MIB_BENCHMARK_FIT_CLASSIFIER=0 → ENGINE A ONLY</text>
</svg>
