<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="700" viewBox="0 0 1500 700" role="img" aria-labelledby="title desc">
  <title id="title">MIB pipeline architecture and evidence guardrails</title>
  <desc id="desc">A flow diagram from rendered PDF evidence to auditable extraction and classification, with strict anti-overfitting guardrails.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0l10 5-10 5z" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect width="1500" height="700" rx="24" fill="#f8fafc"/>
  <text x="60" y="60" fill="#0f172a" font-family="ui-sans-serif, system-ui, sans-serif" font-size="30" font-weight="800">Architecture and evidence guardrails</text>
  <text x="60" y="92" fill="#475569" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18">Every decision flows from rendered, active-case evidence through an auditable policy path.</text>

  <g font-family="ui-sans-serif, system-ui, sans-serif" filter="url(#shadow)">
    <rect x="60" y="150" width="220" height="130" rx="18" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
    <text x="170" y="197" text-anchor="middle" fill="#0f172a" font-size="22" font-weight="700">PDF packets</text>
    <text x="170" y="229" text-anchor="middle" fill="#64748b" font-size="17">read-only input</text>
    <text x="170" y="254" text-anchor="middle" fill="#64748b" font-size="17">3–6 pages</text>

    <rect x="350" y="150" width="250" height="130" rx="18" fill="#ecfeff" stroke="#06b6d4" stroke-width="2"/>
    <text x="475" y="190" text-anchor="middle" fill="#164e63" font-size="22" font-weight="700">Render + OCR</text>
    <text x="475" y="222" text-anchor="middle" fill="#0e7490" font-size="17">Poppler · Tesseract</text>
    <text x="475" y="247" text-anchor="middle" fill="#0e7490" font-size="17">rotation · deskew · crops</text>

    <rect x="670" y="150" width="260" height="130" rx="18" fill="#f0fdfa" stroke="#14b8a6" stroke-width="2"/>
    <text x="800" y="190" text-anchor="middle" fill="#134e4a" font-size="22" font-weight="700">Evidence resolver</text>
    <text x="800" y="222" text-anchor="middle" fill="#0f766e" font-size="17">case binding · precedence</text>
    <text x="800" y="247" text-anchor="middle" fill="#0f766e" font-size="17">corroboration · conflicts</text>

    <rect x="1000" y="150" width="210" height="130" rx="18" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="1105" y="190" text-anchor="middle" fill="#1e3a8a" font-size="22" font-weight="700">Policy engine</text>
    <text x="1105" y="222" text-anchor="middle" fill="#1d4ed8" font-size="17">positive witnesses</text>
    <text x="1105" y="247" text-anchor="middle" fill="#1d4ed8" font-size="17">fail closed</text>

    <rect x="1280" y="150" width="160" height="130" rx="18" fill="#fff" stroke="#334155" stroke-width="2"/>
    <text x="1360" y="197" text-anchor="middle" fill="#0f172a" font-size="22" font-weight="700">JSONL</text>
    <text x="1360" y="229" text-anchor="middle" fill="#64748b" font-size="17">fields</text>
    <text x="1360" y="254" text-anchor="middle" fill="#64748b" font-size="17">decision + p</text>
  </g>

  <g stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M280 215h62"/>
    <path d="M600 215h62"/>
    <path d="M930 215h62"/>
    <path d="M1210 215h62"/>
  </g>

  <rect x="40" y="332" width="1420" height="2" fill="#cbd5e1"/>
  <text x="60" y="374" fill="#334155" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700">ANTI-OVERFITTING GUARDRAILS</text>

  <g font-family="ui-sans-serif, system-ui, sans-serif" filter="url(#shadow)">
    <rect x="70" y="420" width="300" height="145" rx="18" fill="#ecfeff" stroke="#06b6d4" stroke-width="2"/>
    <text x="220" y="462" text-anchor="middle" fill="#164e63" font-size="21" font-weight="700">Case-bound sources</text>
    <text x="220" y="496" text-anchor="middle" fill="#0e7490" font-size="16">foreign IDs are rejected</text>
    <text x="220" y="523" text-anchor="middle" fill="#0e7490" font-size="16">conflicts remain review</text>

    <rect x="420" y="420" width="300" height="145" rx="18" fill="#f0fdfa" stroke="#14b8a6" stroke-width="2"/>
    <text x="570" y="462" text-anchor="middle" fill="#134e4a" font-size="21" font-weight="700">Cross-corpus profiles</text>
    <text x="570" y="496" text-anchor="middle" fill="#0f766e" font-size="16">no names, IDs, sponsor values</text>
    <text x="570" y="523" text-anchor="middle" fill="#0f766e" font-size="16">flagged and independently checked</text>

    <rect x="770" y="420" width="300" height="145" rx="18" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="920" y="462" text-anchor="middle" fill="#1e3a8a" font-size="21" font-weight="700">Visible policy witnesses</text>
    <text x="920" y="496" text-anchor="middle" fill="#1d4ed8" font-size="16">risk · fee · visa · sponsor</text>
    <text x="920" y="523" text-anchor="middle" fill="#1d4ed8" font-size="16">document precedence enforced</text>

    <rect x="1120" y="420" width="300" height="145" rx="18" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
    <text x="1270" y="462" text-anchor="middle" fill="#7c2d12" font-size="21" font-weight="700">No answer shortcuts</text>
    <text x="1270" y="496" text-anchor="middle" fill="#9a3412" font-size="16">no hidden payloads or lookups</text>
    <text x="1270" y="523" text-anchor="middle" fill="#9a3412" font-size="16">no identity residual cells</text>
  </g>

  <rect x="410" y="618" width="680" height="48" rx="24" fill="#0f172a"/>
  <text x="750" y="649" text-anchor="middle" fill="#e2e8f0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">VISIBLE EVIDENCE IN · AUDITABLE DECISION OUT</text>
</svg>
